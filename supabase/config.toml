# Local Supabase stack for localopenbrainobsidian.
# `supabase start` brings up Postgres+pgvector, Storage, Studio, and the API
# gateway in Docker. The same schema/API runs on managed Supabase later — to
# upgrade, point the app's settings at a hosted project instead.
project_id = "localopenbrainobsidian"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[db.migrations]
enabled = true

[studio]
enabled = true
port = 54323

[storage]
enabled = true
# Document uploads (PDF/docx) land in the `documents` bucket.
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"

[edge_runtime]
enabled = false
